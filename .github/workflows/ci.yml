name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: unit (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # the `graphviz` package is bindings; rendering needs the `dot` binary
      - run: sudo apt-get install -y graphviz
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: pytest -q

  applications:
    name: against ${{ matrix.application.name }}
    runs-on: ubuntu-latest
    strategy:
      # one application failing should not hide the others - the point of this
      # job is knowing *which* of them broke
      fail-fast: false
      matrix:
        application:
          # Pinned, for the same reason scenario plugins are pinned elsewhere:
          # an unpinned application turns "did we break it?" into "did they
          # change something?" at the least convenient moment. Bump deliberately.
          - name: tox
            install: tox==4.31.0
            test: tests/applications/test_real_applications.py::test_tox
          - name: datasette
            install: datasette==0.65.4
            test: tests/applications/test_real_applications.py::test_datasette
          - name: devpi-client
            install: devpi-client==7.3.0
            test: tests/applications/test_real_applications.py::test_devpi
          - name: pytest
            install: ""
            test: >-
              tests/applications/test_real_applications.py::test_pytest
              tests/applications/test_real_applications.py::test_a_failing_program_still_fails
              tests/applications/test_real_applications.py::test_output_is_left_alone
              tests/applications/test_real_applications.py::test_a_command_that_builds_no_plugin_manager_says_so
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y graphviz
      - run: pip install -e ".[dev]"
      - name: Install ${{ matrix.application.name }}
        if: matrix.application.install != ''
        run: pip install ${{ matrix.application.install }}
      # -m applications overrides the addopts that deselect them by default.
      # These are not mocks: they run the real program and assert it still
      # behaves, so a change here that breaks somebody else's tool is caught.
      - run: pytest -q -m applications ${{ matrix.application.test }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict

  # Nothing in the package may import pytest. It is a test dependency and an
  # application we trace, never something this library needs.
  independence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: |
          python - <<'EOF'
          import sys, pkgutil, importlib
          import hook_atlas
          for module in pkgutil.walk_packages(hook_atlas.__path__, "hook_atlas."):
              importlib.import_module(module.name)
          assert "pytest" not in sys.modules, "hook_atlas imported pytest"
          print(f"imported every module; pytest not among {len(sys.modules)} loaded")
          EOF

  # Trace pytest running a *real* project's test suite, not one we wrote.
  #
  # Deliberate, and the risk is accepted: a synthetic suite only ever exercises
  # what we thought to put in it, and is therefore never wrong in the ways real
  # projects are. datasette's suite brought pytest-asyncio, pytest-xdist and
  # pytest-timeout with it, and found a crash on the first run - its tests chdir
  # into temporary directories and delete them, and os.getcwd() raised inside
  # the tracer. Nothing we would have written ourselves would have done that.
  #
  # The cost is that this job can go red because datasette changed rather than
  # because we did, which is why the version is pinned.
  real-suite:
    name: pytest running datasette's own tests
    runs-on: ubuntu-latest
    env:
      DATASETTE_VERSION: "0.65.4"
    steps:
      - uses: actions/checkout@v4
        with:
          path: hook-atlas
      - uses: actions/checkout@v4
        with:
          repository: simonw/datasette
          ref: ${{ env.DATASETTE_VERSION }}
          path: datasette
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y graphviz
      - run: pip install -e ./hook-atlas "./datasette[test]"
      - name: Trace pytest running datasette's tests
        working-directory: datasette
        env:
          HOOK_ATLAS_TRACE: ${{ github.workspace }}/datasette-suite.json
        run: |
          python -c "import sys; from hook_atlas.cli import run; sys.exit(run(sys.argv[1:]))" \
            pytest -q -p no:cacheprovider tests/test_utils.py
      - name: Validate the trace
        run: python -m hook_atlas.validate datasette-suite.json

  # Trace pytest running our own test suite.
  #
  # Also deliberate. Self-reference has one genuine hazard: the tests that
  # exercise watch()/attach() borrow the same module-level recorder the outer
  # trace is using. The `tracer_globals` fixture now refuses to run when a trace
  # is already live, so they skip rather than steal it - this exclusion is belt
  # and braces, not the only defence. It was the only defence once, and a single
  # test added to the wrong file destroyed the outer recording and then let the
  # tool report that there had been nothing to trace.
  #
  # What is left is worth having: it is the only leg where the traced suite
  # changes as we work, so it notices when our own code starts doing something
  # the tracer cannot follow.
  dogfood:
    name: pytest running our own tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y graphviz
      - run: pip install -e ".[dev]"
      - name: Trace our own suite
        env:
          HOOK_ATLAS_TRACE: ${{ github.workspace }}/dogfood.json
        run: |
          python -c "import sys; from hook_atlas.cli import run; sys.exit(run(sys.argv[1:]))" \
            pytest -q -p no:cacheprovider tests/ \
              --ignore tests/test_tracer.py --ignore tests/applications
      - name: Validate the trace
        run: python -m hook_atlas.validate dogfood.json
